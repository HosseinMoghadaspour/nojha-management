
services:
  db:
    image: postgres:17-alpine
    container_name: nozha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nozha_db
      POSTGRES_USER: nozha_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nozha_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nozha_user -d nozha_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nozha_postgres_data:
